name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o codigo
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Instalar dependencias
        run: python -m pip install -r backend/requirements-dev.txt

      - name: Testar backend e protecoes de seguranca
        run: python -m unittest discover -s backend/tests -v

      - name: Validar sintaxe Python
        run: python -m compileall -q backend

      - name: Validar sintaxe JavaScript
        run: |
          node --check js/api.js
          node --check js/components.js
          node --check js/data.js
          node --check js/storage.js
          node --check js/admin.js
          node --check js/inscricao.js
          node --check service-worker.js
